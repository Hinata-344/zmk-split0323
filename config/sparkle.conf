# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Sparkle OLED Display
# CONFIG_ZMK_DISPLAY=y

# ZMK Studio is enabled from the central-half build in build.yaml.
# If you switch the USB-connected central side, move the Studio snippet there too.
CONFIG_ZMK_STUDIO_LOCKING=n

# NOTE: On BLE split keyboards, "deep sleep" cannot be reliably synchronized:
# once each half powers off, it can't wake the other half remotely.
# To keep left/right behavior aligned, use the *idle* low-power state instead
# (stays connected, wakes instantly from either half).
#
# Enter idle after 15 minutes of inactivity.
CONFIG_ZMK_IDLE_TIMEOUT=900000
CONFIG_ZMK_SLEEP=n
